// BP change user input from file to PDB ID as necessary
function updateSelect1(sel1)
{
	var pdb1 = sel1.options[sel1.selectedIndex].value;
	var file1 = document.getElementById("pdb1upload");
	var pdbid1 = document.getElementById("pdb1id");
	if ((pdb1 == "file") && (file1.style.display == "none")) {
		file1.style.display="block";
		pdbid1.style.display="none";
		document.getElementById("pdbid1").value = "";
		get_pdbinfo("", "pdbinfo1", 1);
	}
	else if ((pdb1 == "pdbid") && (pdbid1.style.display == "none")) {
		pdbid1.style.display="block";
		file1.style.display="none";
		document.getElementById("file1").value = "";
	}
}

function updateSelect2(sel2)
{
        var pdb2 = sel2.options[sel2.selectedIndex].value;
        var file2 = document.getElementById("pdb2upload");
        var pdbid2 = document.getElementById("pdb2id");
        if ((pdb2 == "file") && (file2.style.display == "none")) {
                file2.style.display="block";
                pdbid2.style.display="none";
                document.getElementById("pdbid2").value = "";
                get_pdbinfo("", "pdbinfo2", 2);
        }
        else if ((pdb2 == "pdbid") && (pdbid2.style.display == "none")) {
                pdbid2.style.display="block";
                file2.style.display="none";
                document.getElementById("file2").value = "";
        }
}

// BP 10/22/12 dynamically select residues in Jmol
var select_contact = ["",""];
var select_block = ["",""];
function show_selected(pBox, pdb_num, is_block)
{
  var initial = "select all; wireframe off; color white;";
  jmolScript(initial, pdb_num);

  var temp = "select ";
  var select_count = 0;
  for(var i = 0; i < pBox.options.length; i++)
    {
      if(pBox.options[i].selected)
	{
	  var fields = pBox.options[i].text.split(" ");
	  if (select_count > 0) temp += ",";
	  temp += fields[0];
	  if (fields[2] != "_") temp += ":" + fields[2];  // ignore the chain id if it's blank
	  select_count++;
	}
    } 
  if (select_count == 0) temp += "none"; 

  var new_color = "blue";
  if (is_block) new_color = "red";
  
  temp += "; wireframe 0.3; color " + new_color + ";";
  
  // execute newly changed residue set last in case there is overlap
  if (is_block == "1")
    {
      if (select_contact[pdb_num] != "") jmolScript(select_contact[pdb_num], pdb_num);
      jmolScript(temp, pdb_num);
      select_block[pdb_num] = temp;
    }
  else // contacts
    {
      if (select_block[pdb_num] != "") jmolScript(select_block[pdb_num], pdb_num);
      jmolScript(temp, pdb_num);
      select_contact[pdb_num] = temp;
    }
}
